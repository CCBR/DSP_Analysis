# ---------------------------------------------------------------------------
# Pipeline parameters for DSP QC and filtering script
# ---------------------------------------------------------------------------
# Edit the values below, then run the pipeline with:
#   Rscript run_pipeline.R params.yaml
#
# All folder paths should end with a trailing slash "/" since the script
# builds file paths with paste0(params$data.folder, filename).
# ---------------------------------------------------------------------------

title: "DSP Analysis QC Report Template"
format:
  html:
    code-fold: true
    embed-resources: true

run.params:
    # Run standr with a range of k values to evaluate the best k for normalization
    k.eval: true
    # An RDS for each step, QC plots, and normalized
    export.qc: false
    # Export the normalized counts for each method type
    export.counts: false

paths:
    dsp.analysis.folder: "/Users/cauleyes/CPTR/DSP_Analysis/"
    data.folder: "test_datasets/Human_Kidney/"
    results.folder: "test_datasets/Human_Kidney/"
    run.folder: "qc_report/"
    dataset.name: "human_kidney_test"

initialization:
  pkc.file.name: "TAP_H_WTA_v1.0.pkc"
  pkc.file.path: "test_datasets/Human_Kidney/TAP_H_WTA_v1.0.pkc"
  annotation.file.name: "test_annotation_kidney.xlsx"
  annotation.file.path: "test_datasets/Human_Kidney/test_annotation_kidney.xlsx"
  dcc.folder: "downloaded/dccs/"
  annotation.sheet.name: "Template"
  sample.id.field.name: "Sample_ID"
  roi.field.name: "roi"
  panel.field.name: "panel"
  class.field.name: "class"
  region.field.name: "region"
  segment.field.name: "segment"
  area.field.name: "area"
  nuclei.field.name: "nuclei"
  exclude.sankey: false
  segment.id.length: 8
  export: false

# Sankey Plot Parameters
# Put []"default"] for lane order if you want to use abc order
sankey:
    lane.1: "slide_name"
    lane.1.order: ["disease3", "disease4", "normal3", "normal4", "disease1B", "disease2B", "normal2B"]
    lane.2: "class"
    lane.2.order: ["DKD", "normal"]
    lane.3: "region"
    lane.3.order: ["glomerulus", "tubule"]
    lane.4: "segment"
    lane.4.order: ["GeometricSegment", "PanCK_pos", "PanCK_neg"]
    lane.fill: "region"
    # Combine columns to address colinearity
    combine.cols: true
    cols.to.combine: ["region", "pathology",  "segment"]

# Initial QC for all AOIs, export.standr is the input for standr QC
qc: 
    min.segment.reads: 1000 
    percent.trimmed: 80  
    percent.stitched: 80  
    percent.aligned: 80 
    percent.saturation: 50
    min.negative.count: 1.5
    max.ntc.count: 10000  
    min.nuclei: 50       
    min.area: 1000 
    # The input for standr filtering
    export.standr: true
    qc.plot.bio.field.1: "combined_column"
    qc.plot.bio.field.2: "class"
    qc.plot.batch.field: "slide_name"
    goi: ["A2M", "CD44"]

standr.filtering: 
    gene.filter: 
        # Sample fraction is the fraction of all AOIs a gene is found below the min count
        # Counts are converted to logCPM before sample fraction evaluation
        min.count: 5
        sample.fraction: 0.9
    aoi.filter:
        lib.size: 50000

default.filtering: 
    # The percentage of AOIs a gene is detected in to be included in the analysis
    gene.detection.cutoff: 5
    # The percentage of genes an AOI must have detected to be included in the analysis
    aoi.detection.cutoff: 5


standr.normalization:
    batch.field: "slide_name"
    # The number of least variable genes to use a controls
    top.n: 200
    # Fields that represent the biological factors of interest
    bio.fields: ["combined_column", "class"]
    # The best k value for normalization, if best.k.chosen is true, this will be used for normalization
    best.k: 2

default.normalization:
    export.normalized.counts: false

MA: 
    # The field to use for comparison. The levels are in the order condition, reference
    contrast.field: "region"
    contrast.levels: ["glomerulus", "tubule"]

PCA: 
    plots:
        dataset.field: "pathology"
    subset:
    # Create PCA tables for each of the subsets defined below
        All:
            class:
                - DKD  
                - normal
        DKD:
            class:
                - DKD
        Normal:
            class:
                - normal
        Glomerulus:
            region:
                - glomerulus
        Tubule:
            region:
                - tubule
        Abnormal_Glomerulus:
            region: glomerulus
            pathology: abnormal
        # Save the PCA tables
        export: false
    
# ============================================================
# Differential Expression (DE) Parameters
# ============================================================

de:
  # Parameters shared across all comparisons below.
  # Each comparison inherits these via the YAML anchor/merge key "<<: *common_de_params",
  # then overrides only what's unique to that comparison.
  #
  # NOTE: YAML's "<<" merge only combines keys at the top level, unlike R's
  # modifyList() which merges nested lists recursively. Because each comparison
  # needs to override specific fields *within* the nested "standr" list
  # (design.annotation, contrast.numerator, contrast.denominator) while keeping
  # the rest of "standr" from common, each comparison's "standr" block is written
  # out in full below rather than relying on merge to combine it.
  common: &common_de_params
    # DE methods to run. Options: "default", "standr", or both.
    # When both are supplied, functions run default first, then standr.
    de.method: ["default", "standr"]

    # StandR defaults shared across comparisons
    standr:
      object.name: "standr.ruv.object"
      covariates: ["ruv_W1", "ruv_W2"]
      block.field: "slide_name"
      filter.by.expr: true
      estimate.disp.robust: true
      ebayes.robust: true
      plot.voom: false
      sort.by: "P"
      clean.design.names: true
      print.design.columns: true
      remove.batch.for.gsea: false

    # Volcano parameters
    fc.limit: 1
    padj.limit: 0.05
    n.labels: 10

    write.results: true
    overwrite.results: false

    title.size: 22
    legend.coordinates: [0.99, 0.1]
    x.lab: "Log2 Fold Change"
    y.lab: "-Log10 adjusted p-value"
    dotted.line.color: "black"
    alpha: 1
    nonDE.color: "gray60"
    upDE.color: "red"
    downDE.color: "blue"
    label.size: 8
    nolabel.label.size: 4
    label.color: "black"
    axis.tick.label.size: 20
    legend.text.size: 20
    axis.title.size: 20

    volcano.width: 14
    volcano.height: 10

    label.top.genes: false
    make.nolabel.volcano: false

    export.volcano: false
    export.volcano.nolabel: false
    export.gsea.input: false

  # Individual comparisons with unique parameters
  comparisons:

    - <<: *common_de_params
      contrast.name: "DKD_Tubule_panck_pos_vs_neg"
      heading: "DKD Tubule PanCK Pos vs. Neg"

      overwrite.results: false

      subset.group.1:
        class: ["DKD"]
        region: ["tubule"]
        segment: ["PanCK_pos"]

      subset.group.2:
        class: ["DKD"]
        region: ["tubule"]
        segment: ["PanCK_neg"]

      # Default DSPWorkflow diffExpr parameters
      analysis.type: "Within Groups"
      region.col: "segment"
      regions: ["PanCK_pos", "PanCK_neg"]
      group.col: "region"
      groups: ["tubule"]
      legend.title: "Expression in PanCK+"

      # StandR parameters (common defaults + comparison-specific contrast fields)
      standr:
        object.name: "standr.ruv.object"
        covariates: ["ruv_W1", "ruv_W2"]
        block.field: "slide_name"
        filter.by.expr: true
        estimate.disp.robust: true
        ebayes.robust: true
        plot.voom: false
        sort.by: "P"
        clean.design.names: true
        print.design.columns: true
        remove.batch.for.gsea: false
        design.annotation: "segment"
        contrast.numerator: "PanCK_pos"
        contrast.denominator: "PanCK_neg"

      # Volcano plot
      volcano.title: "DKD Tubule - PanCK Pos vs. Neg"
      label.top.genes: false

      # GSEA
      gsea.contrast.field: "segment"
      gsea.contrast.levels: ["PanCK_pos", "PanCK_neg"]

    - <<: *common_de_params
      contrast.name: "Glomerulus_DKD_vs_Normal"
      heading: "Glomerulus DKD vs Normal"

      subset.group.1:
        class: ["DKD"]
        region: ["glomerulus"]

      subset.group.2:
        class: ["normal"]
        region: ["glomerulus"]

      # Default DSPWorkflow diffExpr parameters
      analysis.type: "Between Groups"
      region.col: "region"
      regions: ["glomerulus"]
      group.col: "class"
      groups: ["DKD", "normal"]
      legend.title: "Expression in DKD"

      # For DKD vs normal, the design annotation should be class.
      standr:
        object.name: "standr.ruv.object"
        covariates: ["ruv_W1", "ruv_W2"]
        block.field: "slide_name"
        filter.by.expr: true
        estimate.disp.robust: true
        ebayes.robust: true
        plot.voom: false
        sort.by: "P"
        clean.design.names: true
        print.design.columns: true
        remove.batch.for.gsea: false
        design.annotation: "class"
        contrast.numerator: "DKD"
        contrast.denominator: "normal"

      # Volcano plot
      volcano.title: "Glomerulus DKD vs. Normal"
      label.top.genes: false

      # GSEA
      gsea.contrast.field: "class"
      gsea.contrast.levels: ["DKD", "normal"]

    - <<: *common_de_params
      contrast.name: "DKD_Glomerulus_vs_Tubule"
      heading: "DKD Glomerulus vs Tubule"

      subset.group.1:
        class: ["DKD"]
        region: ["glomerulus", "tubule"]

      subset.group.2:
        class: ["DKD"]
        region: ["glomerulus", "tubule"]

      # Default DSPWorkflow diffExpr parameters
      analysis.type: "Within Groups"
      region.col: "region"
      regions: ["glomerulus", "tubule"]
      group.col: "class"
      groups: ["DKD"]
      legend.title: "Expression in Glomerulus"

      # For glomerulus vs tubule, the design annotation should be region.
      standr:
        object.name: "standr.ruv.object"
        covariates: ["ruv_W1", "ruv_W2"]
        block.field: "slide_name"
        filter.by.expr: true
        estimate.disp.robust: true
        ebayes.robust: true
        plot.voom: false
        sort.by: "P"
        clean.design.names: true
        print.design.columns: true
        remove.batch.for.gsea: false
        design.annotation: "region"
        contrast.numerator: "glomerulus"
        contrast.denominator: "tubule"

      # Volcano plot
      volcano.title: "DKD Glomerulus vs. Tubule"
      label.top.genes: false

      # GSEA
      gsea.contrast.field: "region"
      gsea.contrast.levels: ["glomerulus", "tubule"]